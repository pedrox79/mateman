<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mante - Bienvenido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center-layout">
  <div class="card shadow">
    <h1>📐 Mante</h1>
    <p>Aprende matemáticas paso a paso, desde lo básico hasta nivel máster.</p>
    
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Ingresa tu Nombre / Alias:</label>
        <input type="text" id="username" placeholder="Ej. Carlos123" required autocomplete="off">
      </div>
      <button type="submit" class="btn primary">Continuar ➔</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      if(user) {
        localStorage.setItem('mante_user', user);
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
